# =============================================================================
# hbx Configuration Example (config.example.toml)
# =============================================================================
# Copy this file to ~/.config/hbx/config.toml or project-local .hbx.toml
# to customize default behavior.
#
# Precedence:
#   CLI Flags > Environment Variables / .env > .hbx.toml > ~/.config/hbx/config.toml > Defaults
# =============================================================================

# Base URL of the remote Homebox instance (with or without /api/v1).
# CLI: --url <URL> | Env: HBX_URL > HOMEBOX_URL > HOMEBOX_IP (http://<HOMEBOX_IP>:7745)
# url = "http://192.168.1.50:7745"

# Homebox API key (hb_...) or Bearer token.
# CLI: --api-key <KEY> | Env: HBX_API_KEY > HOMEBOX_API_KEY
# api_key = "hb_..."

# Default output format: "table", "json", or "plain".
# CLI: --output <table|json|plain> (--json) | Env: HBX_OUTPUT
# output = "table"

# HTTP request timeout in seconds for standard API operations (default: 30).
# timeout_secs = 30

# HTTP request timeout in seconds for streaming attachment downloads (default: 120).
# download_timeout_secs = 120
